<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CW Signal Simulator</title>
<link rel="icon" href="./assets/images/favicon.png" type="image/png">
<style>
  html, body { margin: 0; height: 100%; background: hsl(0, 0%, 7%); color: #eee; font-family: sans-serif; }
  #bar { height: 40px; display: flex; align-items: center; gap: 16px; padding: 0 16px; font-size: 14px;
         background: hsl(240, 2%, 12%); border-bottom: 1px solid hsl(0, 0%, 22%); }
  #bar a { color: hsl(45, 100%, 72%); text-decoration: none; }
  #bar a:hover { text-decoration: underline; }
  iframe { width: 100%; height: calc(100% - 40px); border: 0; display: block; }
</style>
</head>
<body>
<div id="bar">
  <a href="./index.html">&larr; Back</a>
  <span>CW Signal Simulator: continuous gravitational-wave signals from non-axisymmetric spinning neutron stars</span>
  <a id="src" href="https://github.com/damondmc/cwsky" target="_blank" rel="noopener">source</a>
</div>
<iframe id="frame" title="CW Signal Simulator"></iframe>
<script>
  // Local preview (python -m http.server) uses the simulator served on port 8001;
  // the published site uses the GitHub Pages copy.
  const local = ["localhost", "127.0.0.1"].includes(location.hostname);
  document.getElementById("frame").src = local ? "http://127.0.0.1:8001/" : "https://damondmc.github.io/cwsky/";
</script>
</body>
</html>
